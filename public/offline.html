<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0c">
    <title>Die on This Hill</title>
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: #0a0a0c; color: #f5f3ef; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 460px; text-align: center; }
      h1 { font-size: 2rem; letter-spacing: -0.04em; }
      p { color: #aaa7a0; line-height: 1.6; }
      a { display: inline-block; padding: 0.85rem 1.15rem; border-radius: 14px; background: #ff5a36; color: white; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #f5f3ef; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Die on This Hill</h1>
      <p>Die on This Hill requires an internet connection to play.</p>
      <p>Reconnect, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
